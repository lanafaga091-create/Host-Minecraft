<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="white"/>
  
  <!-- Red 3D border left -->
  <polygon points="20,20 35,20 35,280 20,280" fill="#FF4444"/>
  
  <!-- Red 3D border right -->
  <polygon points="280,20 265,20 265,280 280,280" fill="#FF4444"/>
  
  <!-- Red 3D border bottom right -->
  <polygon points="265,280 280,280 280,295 265,295" fill="#FF4444"/>
  
  <!-- QR Code Pattern (simplified representation) -->
  <g id="qr-pattern">
    <!-- Top-left corner pattern -->
    <rect x="20" y="20" width="12" height="12" fill="black"/>
    <rect x="32" y="20" width="12" height="12" fill="white"/>
    <rect x="44" y="20" width="12" height="12" fill="black"/>
    <rect x="56" y="20" width="12" height="12" fill="black"/>
    <rect x="68" y="20" width="12" height="12" fill="black"/>
    
    <rect x="20" y="32" width="12" height="12" fill="black"/>
    <rect x="32" y="32" width="12" height="12" fill="white"/>
    <rect x="44" y="32" width="12" height="12" fill="black"/>
    <rect x="56" y="32" width="12" height="12" fill="white"/>
    <rect x="68" y="32" width="12" height="12" fill="black"/>
    
    <!-- Random QR pattern in middle -->
    <rect x="80" y="50" width="10" height="10" fill="black"/>
    <rect x="100" y="50" width="10" height="10" fill="black"/>
    <rect x="120" y="60" width="10" height="10" fill="black"/>
    <rect x="140" y="70" width="10" height="10" fill="black"/>
    <rect x="160" y="50" width="10" height="10" fill="black"/>
    <rect x="180" y="60" width="10" height="10" fill="black"/>
    <rect x="200" y="70" width="10" height="10" fill="black"/>
    
    <!-- More scattered pattern -->
    <rect x="90" y="90" width="10" height="10" fill="black"/>
    <rect x="110" y="100" width="10" height="10" fill="black"/>
    <rect x="130" y="110" width="10" height="10" fill="black"/>
    <rect x="150" y="100" width="10" height="10" fill="black"/>
    <rect x="170" y="90" width="10" height="10" fill="black"/>
    <rect x="190" y="110" width="10" height="10" fill="black"/>
    <rect x="210" y="100" width="10" height="10" fill="black"/>
    
    <!-- Bottom-right corner pattern -->
    <rect x="220" y="220" width="12" height="12" fill="black"/>
    <rect x="208" y="220" width="12" height="12" fill="white"/>
    <rect x="196" y="220" width="12" height="12" fill="black"/>
    <rect x="184" y="220" width="12" height="12" fill="black"/>
    <rect x="172" y="220" width="12" height="12" fill="black"/>
    
    <rect x="220" y="208" width="12" height="12" fill="black"/>
    <rect x="208" y="208" width="12" height="12" fill="white"/>
    <rect x="196" y="208" width="12" height="12" fill="black"/>
    <rect x="184" y="208" width="12" height="12" fill="white"/>
    <rect x="172" y="208" width="12" height="12" fill="black"/>
  </g>
  
  <!-- Watermark text -->
  <text x="150" y="280" font-size="14" font-weight="bold" fill="#CCCCCC" text-anchor="middle">QRIS</text>
</svg>